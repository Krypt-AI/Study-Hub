    "solution": "function paginate(items, page, pageSize) {\n  const start = (page - 1) * pageSize;\n  return {\n    items: items.slice(start, start + pageSize),\n    total: items.length,\n    totalPages: Math.ceil(items.length / pageSize),\n  };\n}\n",
