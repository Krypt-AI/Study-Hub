- id: ai12.lab.image-container
  type: choice
  skill: recognize
  topics: [ai12.lab]
  prompt: "After `docker run hello-world`, `docker images` lists `hello-world` and `docker ps -a` lists a stopped container. What is the difference?"
  options:
    - { id: a, text: "An image is the read-only template; a container is a running or finished instance made from it", explanation: "Correct." }
    - { id: b, text: "They are two names for the same thing", explanation: "They are different objects." }
    - { id: c, text: "A container is the file you download", explanation: "That is the image." }
  correct: [a]

- id: ai12.lab.publish
  type: choice
  skill: apply
  topics: [ai12.lab]
  prompt: "Why run the service with `-p 127.0.0.1:8000:8000` rather than `-p 8000:8000`?"
  options:
    - { id: a, text: "It publishes the port to your own machine only, so nothing else on the network can reach a service you are still testing", explanation: "Correct." }
    - { id: b, text: "It makes requests faster", explanation: "Not the reason." }
    - { id: c, text: "Docker requires the 127.0.0.1 form", explanation: "Both forms work; they differ in who can connect." }
  correct: [a]

