- id: ai09.production.backoff
  type: code
  skill: apply
  topics: [ai09.production]
  language: python
  prompt: >-
    Implement retry-with-backoff logic (no real network). Write `call_with_retry(fn, max_attempts=4, base=1.0)` that
    calls `fn()` and returns its result; if `fn` raises `RateLimitError`, wait (record the delay) and retry up to
    `max_attempts`, with delay `base * 2**(attempt-1)` for attempt 1,2,3...; re-raise if attempts run out. Record
    delays in a module list `DELAYS` instead of really sleeping.
  starterCode: |
    DELAYS = []

    class RateLimitError(Exception):
        pass

    def call_with_retry(fn, max_attempts=4, base=1.0):
        ...
  tests:
    - { kind: assert, name: "succeeds first try", code: "DELAYS.clear()\nassert call_with_retry(lambda: 42) == 42 and DELAYS == []" }
    - { kind: assert, name: "retries then succeeds with backoff", code: "DELAYS.clear()\nstate = {'n': 0}\n\ndef flaky():\n    state['n'] += 1\n    if state['n'] < 3:\n        raise RateLimitError()\n    return 'ok'\nassert call_with_retry(flaky) == 'ok'\nassert DELAYS == [1.0, 2.0]" }
    - { kind: assert, name: "gives up", code: "DELAYS.clear()\n\ndef always():\n    raise RateLimitError()\ntry:\n    call_with_retry(always, max_attempts=3)\n    raise AssertionError('expected RateLimitError')\nexcept RateLimitError:\n    pass\nassert DELAYS == [1.0, 2.0]" }
  solution: |
    DELAYS = []

    class RateLimitError(Exception):
        pass

    def call_with_retry(fn, max_attempts=4, base=1.0):
        for attempt in range(1, max_attempts + 1):
            try:
                return fn()
            except RateLimitError:
                if attempt == max_attempts:
                    raise
                DELAYS.append(base * 2 ** (attempt - 1))
