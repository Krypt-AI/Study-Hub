- id: ai09.structured.validate-code
  type: code
  skill: apply
  topics: [ai09.structured]
  language: python
  prompt: >-
    Simulate validating an LLM's JSON reply. Write `parse_flashcard(text)` that parses `text` as JSON and returns a
    dict only if it has string `front`, string `back`, and integer `difficulty` in 1..5; otherwise raise `ValueError`.
    Use the `json` module.
  starterCode: |
    import json

    def parse_flashcard(text):
        ...
  tests:
    - { kind: assert, name: "valid", code: "assert parse_flashcard('{\"front\":\"Q\",\"back\":\"A\",\"difficulty\":3}') == {'front': 'Q', 'back': 'A', 'difficulty': 3}" }
    - { kind: assert, name: "bad json", code: "try:\n    parse_flashcard('not json')\n    raise AssertionError('expected ValueError')\nexcept ValueError:\n    pass" }
    - { kind: assert, name: "out of range", code: "try:\n    parse_flashcard('{\"front\":\"Q\",\"back\":\"A\",\"difficulty\":9}')\n    raise AssertionError('expected ValueError')\nexcept ValueError:\n    pass" }
    - { kind: assert, name: "wrong type", code: "try:\n    parse_flashcard('{\"front\":1,\"back\":\"A\",\"difficulty\":2}')\n    raise AssertionError('expected ValueError')\nexcept ValueError:\n    pass" }
  solution: |
    import json

    def parse_flashcard(text):
        try:
            data = json.loads(text)
        except json.JSONDecodeError as exc:
            raise ValueError("invalid JSON") from exc
        if not isinstance(data, dict):
            raise ValueError("not an object")
        if not isinstance(data.get("front"), str) or not isinstance(data.get("back"), str):
            raise ValueError("front/back must be strings")
        diff = data.get("difficulty")
        if not isinstance(diff, int) or isinstance(diff, bool) or not 1 <= diff <= 5:
            raise ValueError("difficulty must be an int in 1..5")
        return {"front": data["front"], "back": data["back"], "difficulty": diff}
