- id: ai09.structured.why
  type: choice
  skill: recognize
  topics: [ai09.structured]
  prompt: Why prefer schema-constrained output over parsing the model's prose with regex?
  options:
    - { id: a, text: "The provider enforces the structure during generation, so output is reliably machine-readable", explanation: "Correct." }
    - { id: b, text: "Regex is not available in Python", explanation: "It is; the issue is brittleness." }
    - { id: c, text: "Prose is always valid JSON", explanation: "It is not." }
  correct: [a]

