- id: ai09.structured.tools
  type: choice
  skill: recognize
  topics: [ai09.structured]
  prompt: How does structured output relate to tool/function calling?
  options:
    - { id: a, text: "Both are schema-driven: a function schema is like a structured-output schema the model fills with call arguments", explanation: "Correct." }
