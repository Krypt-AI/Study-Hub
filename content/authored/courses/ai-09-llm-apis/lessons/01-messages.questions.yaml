- id: ai09.messages.stateless
  type: choice
  skill: apply
  topics: [ai09.messages]
  prompt: A chatbot forgets what the user said two turns ago. What is almost certainly missing?
  options:
    - { id: a, text: "The app is not resending the full conversation history each call — the model is stateless", explanation: "Correct." }
    - { id: b, text: "The temperature is too low", explanation: "Unrelated to memory." }
    - { id: c, text: "The API key expired", explanation: "That would stop calls entirely." }
  correct: [a]

