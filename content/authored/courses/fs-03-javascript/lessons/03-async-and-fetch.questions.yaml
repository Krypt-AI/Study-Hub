    "solution": "function retry(task, attempts) {\n  let lastError;\n  for (let i = 0; i < attempts; i++) {\n    try {\n      return task();\n    } catch (error) {\n      lastError = error;\n    }\n  }\n  throw lastError;\n}\n",
