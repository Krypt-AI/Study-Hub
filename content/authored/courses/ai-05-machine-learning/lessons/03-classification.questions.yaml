- id: ai05.classification.resample
  type: choice
  skill: apply
  topics: [ai05.classification]
  prompt: When oversampling the minority class, which data should be resampled?
  options:
    - { id: a, text: "Only the training data", explanation: "Correct: validation and test must reflect reality." }
    - { id: b, text: "All data before splitting", explanation: "Copies end up in the test set." }
    - { id: c, text: "Only the test data", explanation: "That distorts evaluation." }
  correct: [a]

- id: ai05.classification.threshold-code
  type: code
  skill: apply
  topics: [ai05.classification]
  language: python
  packages: [numpy]
  prompt: >-
    Write `pick_threshold(y_true, proba, min_recall)` returning the **highest** threshold from 0.05, 0.10, …, 0.95 whose
    recall (predicting 1 when proba ≥ threshold) is at least `min_recall`. Return `None` if none qualifies. Inputs are
    NumPy arrays.
  starterCode: |
    import numpy as np

    def pick_threshold(y_true, proba, min_recall):
        ...
  tests:
    - { kind: assert, name: "example", code: "import numpy as np\ny = np.array([1, 1, 1, 0, 0])\np = np.array([0.9, 0.6, 0.3, 0.4, 0.1])\nassert abs(pick_threshold(y, p, 1.0) - 0.3) < 1e-9\nassert abs(pick_threshold(y, p, 0.6) - 0.6) < 1e-9" }
    - { kind: assert, name: "none", code: "import numpy as np\nassert pick_threshold(np.array([1]), np.array([0.01]), 1.0) is None" }
  solution: |
    import numpy as np

    def pick_threshold(y_true, proba, min_recall):
        positives = (y_true == 1).sum()
        for t in [round(0.95 - 0.05 * i, 2) for i in range(19)]:
            tp = ((proba >= t) & (y_true == 1)).sum()
            if positives and tp / positives >= min_recall:
                return t
        return None
