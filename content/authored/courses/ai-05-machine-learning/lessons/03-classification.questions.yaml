- id: ai05.classification.threshold
  type: choice
  skill: apply
  topics: [ai05.classification]
  prompt: A screening model must miss as few sick patients as possible. How should you move the decision threshold?
  options:
    - { id: a, text: "Lower it, so more cases are flagged (higher recall).", explanation: "Correct, at the cost of more false positives." }
    - { id: b, text: "Raise it.", explanation: "That flags fewer cases and misses more patients." }
    - { id: c, text: "Keep 0.5; thresholds cannot change.", explanation: "They can and often should." }
  correct: [a]

