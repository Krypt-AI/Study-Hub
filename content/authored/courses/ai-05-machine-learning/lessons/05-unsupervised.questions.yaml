- id: ai05.unsupervised.kmeans-steps
  type: choice
  skill: recognize
  topics: [ai05.unsupervised]
  prompt: After assigning every point to its nearest centre, what does k-means do next?
  options:
    - { id: a, text: "Moves each centre to the mean of the points assigned to it", explanation: "Correct." }
    - { id: b, text: "Deletes the smallest cluster", explanation: "k stays fixed." }
    - { id: c, text: "Labels the clusters using y", explanation: "There are no labels." }
  correct: [a]

