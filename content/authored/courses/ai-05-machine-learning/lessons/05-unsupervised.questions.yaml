- id: ai05.unsupervised.dbscan
  type: choice
  skill: apply
  topics: [ai05.unsupervised]
  prompt: Your data forms two interlocking crescent shapes with a few scattered noise points. Which method suits it?
  options:
    - { id: a, text: "DBSCAN", explanation: "Correct: arbitrary shapes, noise labelled." }
    - { id: b, text: "k-means with k = 2", explanation: "It assumes round clusters and cuts the crescents wrongly." }
    - { id: c, text: "PCA", explanation: "PCA reduces dimensions; it does not cluster." }
  correct: [a]

