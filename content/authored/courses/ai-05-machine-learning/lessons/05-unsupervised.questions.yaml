- id: ai05.unsupervised.choose-k
  type: code
  skill: apply
  topics: [ai05.unsupervised]
  language: python
  packages: [scikit-learn]
  prompt: >-
    Write `best_k(X, ks)` that scales X with StandardScaler, fits `KMeans(n_clusters=k, n_init=10, random_state=0)` for
    every k in `ks`, and returns the k with the highest silhouette score.
  starterCode: |
    from sklearn.cluster import KMeans
    from sklearn.metrics import silhouette_score
    from sklearn.preprocessing import StandardScaler

    def best_k(X, ks):
        ...
  tests:
    - { kind: assert, name: "three blobs", code: "from sklearn.datasets import make_blobs\nX, _ = make_blobs(n_samples=300, centers=3, cluster_std=0.6, random_state=1)\nassert best_k(X, [2, 3, 4, 5]) == 3" }
  solution: |
    from sklearn.cluster import KMeans
    from sklearn.metrics import silhouette_score
    from sklearn.preprocessing import StandardScaler

    def best_k(X, ks):
        Xs = StandardScaler().fit_transform(X)
        def score(k):
            labels = KMeans(n_clusters=k, n_init=10, random_state=0).fit_predict(Xs)
            return silhouette_score(Xs, labels)
        return max(ks, key=score)
