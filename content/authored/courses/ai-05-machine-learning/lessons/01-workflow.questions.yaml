- id: ai05.workflow.baseline
  type: code
  skill: apply
  topics: [ai05.workflow]
  language: python
  packages: [scikit-learn]
  prompt: >-
    Write `beats_baseline(X, y)` that splits the data (test_size=0.25, random_state=0, stratified), fits a
    `DummyClassifier(strategy='most_frequent')` and a `LogisticRegression(max_iter=1000)` on the training part and
    returns `(baseline_accuracy, model_accuracy)` on the test part.
  starterCode: |
    from sklearn.model_selection import train_test_split
    from sklearn.dummy import DummyClassifier
    from sklearn.linear_model import LogisticRegression

    def beats_baseline(X, y):
        ...
  tests:
    - { kind: assert, name: "model beats baseline", code: "from sklearn.datasets import load_breast_cancer\nX, y = load_breast_cancer(return_X_y=True)\nb, m = beats_baseline(X, y)\nassert 0.6 < b < 0.65 and m > 0.9" }
  solution: |
    from sklearn.model_selection import train_test_split
    from sklearn.dummy import DummyClassifier
    from sklearn.linear_model import LogisticRegression

    def beats_baseline(X, y):
        X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=0, stratify=y)
        baseline = DummyClassifier(strategy='most_frequent').fit(X_train, y_train)
        model = LogisticRegression(max_iter=1000).fit(X_train, y_train)
        return baseline.score(X_test, y_test), model.score(X_test, y_test)
