- id: ai05.workflow.param-hyper
  type: cloze
  skill: recall
  topics: [ai05.workflow]
  prompt: Parameters and hyperparameters.
  text: "Weights learned by `fit` are [[1]]; settings such as `max_depth` that you choose are [[2]]."
  blanks:
