- id: ai05.workflow.task-type
  type: choice
  skill: apply
  topics: [ai05.workflow]
  prompt: Predicting how many minutes a food delivery will take is…
  options:
    - { id: a, text: "Regression", explanation: "Correct: a numeric target." }
    - { id: b, text: "Classification", explanation: "The target is not a category." }
    - { id: c, text: "Clustering", explanation: "There is a label." }
  correct: [a]

- id: ai05.workflow.test-once
  type: choice
  skill: recognize
  topics: [ai05.workflow]
  prompt: Why should the test set be used only once, at the end?
  options:
    - { id: a, text: "Every decision made by looking at it tunes the model to it, so its score stops being an unbiased estimate.", explanation: "Correct." }
    - { id: b, text: "Using it more than once corrupts the data.", explanation: "The data is unchanged; the estimate becomes biased." }
    - { id: c, text: "scikit-learn refuses to score the same data twice.", explanation: "It does not." }
  correct: [a]

- id: ai05.workflow.time-split
  type: choice
  skill: apply
  topics: [ai05.workflow]
  prompt: You predict next month's sales from daily history. How should you split?
  options:
    - { id: a, text: "By time: train on earlier dates, validate and test on later ones.", explanation: "Correct." }
    - { id: b, text: "Randomly, with stratification.", explanation: "The model would see the future." }
    - { id: c, text: "Alphabetically by product.", explanation: "Not a time-aware split." }
