- id: sec05.auth.hash-not-encrypt
  type: choice
  skill: recognize
  topics: [sec05.auth]
  prompt: Why store a password hash rather than an encrypted password?
  options:
    - { id: a, text: "Encryption is reversible: if the key leaks, every password is exposed. A hash cannot be reversed.", explanation: "Correct." }
    - { id: b, text: "Hashes are shorter.", explanation: "Not the reason." }
    - { id: c, text: "Encryption is slower.", explanation: "Not the reason, and slowness is actually wanted for password hashes." }
  correct: [a]

- id: sec05.auth.fast-hash
  type: choice
  skill: apply
  topics: [sec05.auth]
  prompt: Why is a single plain SHA-256 a poor choice for password storage?
  options:
    - { id: a, text: "It is extremely fast, so an attacker with the database can try billions of guesses per second.", explanation: "Correct: use a slow, salted password hash such as Argon2id." }
    - { id: b, text: "It is reversible.", explanation: "It is not reversible; the problem is speed." }
    - { id: c, text: "It cannot handle long inputs.", explanation: "It can." }
  correct: [a]

- id: sec05.auth.phishing-resistant
  type: choice
  skill: apply
  topics: [sec05.auth]
  prompt: A user is phished on a look-alike domain. Which second factor would still protect them?
  options:
    - { id: a, text: "A passkey / FIDO2 security key, which is bound to the real site's origin", explanation: "Correct: it will not authenticate to the wrong origin." }
    - { id: b, text: "An SMS one-time code", explanation: "The user can be tricked into typing it into the fake site." }
    - { id: c, text: "A TOTP authenticator code", explanation: "Better than SMS, but still typeable into a fake site." }
  correct: [a]

- id: sec05.auth.cookie-flags
  type: cloze
  skill: recall
  topics: [sec05.auth]
  prompt: Name the session-cookie flags and their jobs.
  text: "`[[1]]` stops JavaScript reading the cookie, `[[2]]` sends it only over HTTPS, and `[[3]]` limits sending it on cross-site requests."
  blanks:
    - { id: "1", accepted: [HttpOnly, httponly] }
    - { id: "2", accepted: [Secure, secure] }
    - { id: "3", accepted: [SameSite, samesite] }

- id: sec05.auth.defences
  type: long
  skill: explain
  topics: [sec05.auth]
  prompt: A password database was stolen. Explain which storage choices decide how much damage follows, and name one defence that limits online guessing.
  minWords: 30
  rubric:
    - { id: slow-salt, label: "Slow, salted password hashing makes offline guessing expensive and defeats rainbow tables", keywords: [["salt"], ["slow", "argon2", "bcrypt", "scrypt", "pbkdf2"]] }
    - { id: online, label: "Online guessing is limited by rate limiting, lockouts or anomaly detection / MFA", keywords: [["rate limit", "lockout", "throttle", "mfa", "anomaly"]] }
  modelAnswer: >-
    How bad a stolen database is depends on storage: unique salts stop rainbow tables and make each user's hash
    independent, and a slow function such as Argon2id makes every offline guess expensive, so strong passwords survive
    far longer. Plain or unsalted fast hashes fall quickly. Online guessing against the live login is limited by rate
    limiting and account lockouts, anomaly detection, and requiring MFA so a guessed password alone is not enough.
