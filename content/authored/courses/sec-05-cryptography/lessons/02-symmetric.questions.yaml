- id: sec05.symmetric.ecb
  type: choice
  skill: recognize
  topics: [sec05.symmetric]
  prompt: Why should AES-ECB never be used for real data?
  options:
    - { id: a, text: "Identical plaintext blocks produce identical ciphertext, so structure and patterns leak.", explanation: "Correct." }
    - { id: b, text: "It is too slow.", explanation: "Speed is not the problem." }
    - { id: c, text: "It needs a 512-bit key.", explanation: "AES key sizes are 128/192/256." }
  correct: [a]

- id: sec05.symmetric.aead
  type: choice
  skill: apply
  topics: [sec05.symmetric]
  prompt: You need confidentiality and tamper detection for a message. Which should you reach for?
  options:
    - { id: a, text: "An AEAD mode such as AES-GCM or ChaCha20-Poly1305", explanation: "Correct: encryption plus authentication in one vetted primitive." }
    - { id: b, text: "AES-ECB", explanation: "No confidentiality of patterns and no integrity." }
    - { id: c, text: "A plain SHA-256 of the message", explanation: "A hash gives neither confidentiality nor a secret-keyed tag." }
  correct: [a]

