- id: sec08.lab.failed-by-source
  type: code
  skill: apply
  topics: [sec08.lab]
  language: python
  prompt: >-
    Write `failed_by_source(lines)` taking a list of SSH log lines and returning a dict mapping each source address to its
    number of `Failed password` lines (ignore all other lines). Then `top_offender(lines)` returning the address with the most
    failures, or `None` when there are none. The address is the word after `from`.
  starterCode: |
    import re

    def failed_by_source(lines):
        ...

    def top_offender(lines):
        ...
  tests:
    - { kind: assert, name: "counts the sample", code: "log = ['Oct 21 02:14:01 web01 sshd[2211]: Failed password for invalid user admin from 203.0.113.50 port 51234 ssh2', 'Oct 21 02:14:03 web01 sshd[2211]: Failed password for invalid user admin from 203.0.113.50 port 51234 ssh2', 'Oct 21 02:14:05 web01 sshd[2213]: Failed password for invalid user test from 203.0.113.50 port 51240 ssh2', 'Oct 21 02:14:09 web01 sshd[2215]: Failed password for root from 203.0.113.50 port 51251 ssh2', 'Oct 21 02:15:41 web01 sshd[2230]: Failed password for aina from 198.51.100.7 port 40122 ssh2', 'Oct 21 02:16:02 web01 sshd[2236]: Accepted password for aina from 198.51.100.7 port 40130 ssh2']\nassert failed_by_source(log) == {'203.0.113.50': 4, '198.51.100.7': 1}" }
    - { kind: assert, name: "top offender", code: "log = ['x sshd: Failed password for a from 10.0.0.1 port 1 ssh2', 'x sshd: Failed password for b from 10.0.0.2 port 2 ssh2', 'x sshd: Failed password for c from 10.0.0.2 port 3 ssh2']\nassert top_offender(log) == '10.0.0.2'" }
    - { kind: assert, name: "none", code: "assert top_offender(['x sshd: Accepted password for a from 10.0.0.1 port 1 ssh2']) is None" }
  solution: |
    import re

    def failed_by_source(lines):
        counts = {}
        for line in lines:
            match = re.search(r'Failed password for .* from (\S+) port \d+', line)
            if match:
                counts[match.group(1)] = counts.get(match.group(1), 0) + 1
        return counts

    def top_offender(lines):
        counts = failed_by_source(lines)
        return max(counts, key=counts.get) if counts else None
