- id: sec08.lab.pipeline
  type: choice
  skill: apply
  topics: [sec08.lab]
  prompt: "In `grep 'Failed password' auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -rn`, what does `uniq -c` do?"
  options:
    - { id: a, text: "Counts how many times each distinct line appears, which is why the input is sorted first", explanation: "Correct: `uniq` only collapses adjacent duplicates, so `sort` comes before it." }
    - { id: b, text: "Deletes duplicate lines without counting", explanation: "That is plain `uniq`; `-c` adds the counts." }
    - { id: c, text: "Sorts the lines by size", explanation: "That is the last `sort -rn`." }
  correct: [a]

- id: sec08.lab.escalate
  type: choice
  skill: apply
  topics: [sec08.lab]
  prompt: "The log shows four failed logins for admin, test and root from 203.0.113.50, none accepted; and later an accepted login for `aina` followed by `sudo cat /etc/shadow`. Which is the stronger reason to declare an incident?"
  options:
    - { id: a, text: "A successful session performing a privileged read of the password hashes: possible account compromise", explanation: "Correct: quiet privileged action after a successful login." }
    - { id: b, text: "The failed attempts, because they were repetitive", explanation: "They were noisy but failed; block and monitor, but nothing was gained." }
    - { id: c, text: "Neither; failures and sudo are always normal", explanation: "Reading /etc/shadow is not what an ordinary session does." }
  correct: [a]

- id: sec08.lab.hash-copy
  type: choice
  skill: apply
  topics: [sec08.lab]
  prompt: "Why copy the log into an `evidence` folder and hash the copy, rather than analysing the original in place?"
  options:
    - { id: a, text: "To preserve the original unchanged, and to be able to prove later the evidence was not altered by comparing hashes", explanation: "Correct." }
    - { id: b, text: "Because grep cannot read files in /var/log", explanation: "It can, with the right permissions." }
    - { id: c, text: "To make the file smaller", explanation: "Copying does not shrink it." }
  correct: [a]

- id: sec08.lab.custody
  type: choice
  skill: recognize
  topics: [sec08.lab]
  multiple: true
  prompt: "Which belong in a chain-of-custody record? Choose all that apply."
  options:
    - { id: a, text: "What the item is and its hash", explanation: "Identifies the evidence and proves integrity." }
    - { id: b, text: "Who collected it, when and from where", explanation: "The who, when and where of collection." }
    - { id: c, text: "Every person it was handed to, and why", explanation: "Each transfer is a row; a gap breaks the chain." }
    - { id: d, text: "The investigator's opinion of the suspect", explanation: "Opinions do not belong in the custody record." }
  correct: [a, b, c]

- id: sec08.lab.practice-image
  type: choice
  skill: apply
  topics: [sec08.lab]
  prompt: "Why practise Autopsy on the NPS test disk images rather than on a colleague's laptop image?"
  options:
    - { id: a, text: "The NPS images are published for practice and free of non-public personal data; examining someone's real data needs authorisation", explanation: "Correct." }
    - { id: b, text: "Real images cannot be opened by Autopsy", explanation: "It can; the issue is authorisation and privacy." }
