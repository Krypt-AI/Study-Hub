- id: ai07.practice.finetune-lr
  type: choice
  skill: apply
  topics: [ai07.practice]
  prompt: When unfreezing a pretrained backbone for fine-tuning, which learning rate is appropriate?
  options:
    - { id: a, text: "A small one (about 1e-4 or lower)", explanation: "Correct: avoid destroying the pretrained features." }
    - { id: b, text: "A large one (1.0)", explanation: "Would wreck the pretrained weights." }
    - { id: c, text: "Zero", explanation: "Then nothing is fine-tuned." }
  correct: [a]

- id: ai07.practice.early-stopping
  type: code
  skill: apply
  topics: [ai07.practice]
  language: python
  prompt: >-
    Write `early_stop_epoch(val_losses, patience)` returning the index of the epoch whose checkpoint you keep (the best
    validation loss) and the epoch at which training stops: the first epoch where the loss has failed to improve on
    the best for `patience` consecutive epochs, or the last epoch if that never happens. Return `(best, stop)`.
  starterCode: |
    def early_stop_epoch(val_losses, patience):
        ...
  tests:
    - { kind: assert, name: "stops", code: "assert early_stop_epoch([1.0, 0.8, 0.7, 0.72, 0.71, 0.75, 0.6], 3) == (2, 5)" }
    - { kind: assert, name: "never stops", code: "assert early_stop_epoch([1.0, 0.9, 0.8], 2) == (2, 2)" }
    - { kind: assert, name: "late best", code: "assert early_stop_epoch([0.5, 0.6, 0.4, 0.45], 5) == (2, 3)" }
  solution: |
    def early_stop_epoch(val_losses, patience):
        best, waited = 0, 0
        for epoch in range(1, len(val_losses)):
            if val_losses[epoch] < val_losses[best]:
                best, waited = epoch, 0
            else:
                waited += 1
                if waited >= patience:
                    return best, epoch
        return best, len(val_losses) - 1
