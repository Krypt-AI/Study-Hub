- id: ai07.practice.initial-loss
  type: short
  skill: apply
  topics: [ai07.practice]
  prompt: "A freshly initialised 10-class classifier should start with a cross-entropy loss of about what value? (two decimals)"
  accepted: ["2.30", "2.3"]
  match: { mode: number, tolerance: 0.02 }
  explanation: "ln 10 ≈ 2.30: uniform predictions give probability 0.1 to the true class."

- id: ai07.practice.overfit-batch
  type: choice
  skill: apply
  topics: [ai07.practice]
  prompt: Your model cannot drive the loss on a single batch of 16 examples close to zero. What does this tell you?
  options:
    - { id: a, text: "There is a bug in the model, loss or training loop.", explanation: "Correct: any working setup can memorise one batch." }
    - { id: b, text: "You need more data.", explanation: "One batch should be easy to memorise." }
    - { id: c, text: "Add dropout.", explanation: "Regularisation makes memorising harder." }
  correct: [a]

