- id: ai07.cnn.out-size
  type: short
  skill: apply
  topics: [ai07.cnn]
  prompt: "Input 64 × 64, kernel 5 × 5, padding 2, stride 2. What is the output width?"
  accepted: ["32"]
  match: { mode: number }
  explanation: "⌊(64 − 5 + 4) / 2⌋ + 1 = ⌊31.5⌋ + 1 = 32."

- id: ai07.cnn.params
  type: short
  skill: apply
  topics: [ai07.cnn]
  prompt: "How many parameters does `nn.Conv2d(16, 32, kernel_size=3)` have (with bias)?"
  accepted: ["4640"]
  match: { mode: number }
  explanation: "32·(16·3·3 + 1) = 32·145 = 4640."

