- id: ai07.cnn.conv2d
  type: code
  skill: apply
  topics: [ai07.cnn]
  language: python
  packages: [numpy]
  prompt: >-
    Write `conv2d(image, kernel, stride=1)` for 2-D NumPy arrays with no padding (cross-correlation, as deep learning
    libraries compute it: do not flip the kernel). Return the output array.
  starterCode: |
    import numpy as np

    def conv2d(image, kernel, stride=1):
        ...
  tests:
    - { kind: assert, name: "vertical edge", code: "import numpy as np\nimg = np.array([[0, 0, 1, 1]] * 4, dtype=float)\nk = np.array([[-1, 1], [-1, 1]], dtype=float)\nassert np.array_equal(conv2d(img, k), np.array([[0, 2, 0]] * 3, dtype=float))" }
    - { kind: assert, name: "stride 2 shape", code: "import numpy as np\nassert conv2d(np.ones((6, 6)), np.ones((2, 2)), stride=2).shape == (3, 3)" }
    - { kind: assert, name: "values", code: "import numpy as np\nout = conv2d(np.arange(9, dtype=float).reshape(3, 3), np.ones((2, 2)))\nassert np.array_equal(out, np.array([[8, 12], [20, 24]], dtype=float))" }
  solution: |
    import numpy as np

    def conv2d(image, kernel, stride=1):
        kh, kw = kernel.shape
        oh = (image.shape[0] - kh) // stride + 1
        ow = (image.shape[1] - kw) // stride + 1
        out = np.zeros((oh, ow))
        for i in range(oh):
            for j in range(ow):
                patch = image[i * stride:i * stride + kh, j * stride:j * stride + kw]
                out[i, j] = (patch * kernel).sum()
        return out
