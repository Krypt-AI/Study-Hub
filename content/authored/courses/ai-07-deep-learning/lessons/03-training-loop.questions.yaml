- id: ai07.training.order
  type: choice
  skill: recall
  topics: [ai07.training]
  prompt: Which order of calls in a training step is correct?
  options:
    - { id: a, text: "forward → loss → `zero_grad()` → `backward()` → `step()`", explanation: "Correct (zero_grad may also come first)." }
    - { id: b, text: "forward → `step()` → loss → `backward()`", explanation: "step needs gradients from backward first." }
    - { id: c, text: "`backward()` → forward → loss → `step()`", explanation: "Nothing to differentiate yet." }
  correct: [a]

