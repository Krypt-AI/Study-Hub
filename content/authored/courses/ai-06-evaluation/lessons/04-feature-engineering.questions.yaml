- id: ai06.features.cyclical-code
  type: code
  skill: apply
  topics: [ai06.features]
  language: python
  prompt: >-
    Write `encode_cyclical(value, period)` returning `(sin, cos)` of 2π·value/period, and `cyclic_distance(a, b,
    period)` returning the Euclidean distance between the two encodings. Hour 23 should be closer to hour 0 than to
    hour 12.
  starterCode: |
    import math

    def encode_cyclical(value, period):
        ...

    def cyclic_distance(a, b, period):
        ...
  tests:
    - { kind: assert, name: "zero", code: "s, c = encode_cyclical(0, 24)\nassert abs(s) < 1e-9 and abs(c - 1) < 1e-9" }
    - { kind: assert, name: "wrap-around", code: "assert cyclic_distance(23, 0, 24) < cyclic_distance(23, 12, 24)" }
    - { kind: assert, name: "same point", code: "assert cyclic_distance(24, 0, 24) < 1e-9" }
  solution: |
    import math

    def encode_cyclical(value, period):
        angle = 2 * math.pi * value / period
        return math.sin(angle), math.cos(angle)

    def cyclic_distance(a, b, period):
        (s1, c1), (s2, c2) = encode_cyclical(a, period), encode_cyclical(b, period)
        return math.hypot(s1 - s2, c1 - c2)
