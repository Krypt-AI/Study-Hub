- id: ai06.features.log1p
  type: choice
  skill: apply
  topics: [ai06.features]
  prompt: "Purchase counts range from 0 to 50,000 with a long right tail. Which transform suits a linear model?"
  options:
    - { id: a, text: "`np.log1p(count)`", explanation: "Correct: compresses the tail and handles 0." }
    - { id: b, text: "`np.log(count)`", explanation: "log(0) is −infinity." }
    - { id: c, text: "Square the counts", explanation: "That stretches the tail further." }
  correct: [a]

- id: ai06.features.tree-invariant
  type: choice
  skill: recognize
  topics: [ai06.features]
  prompt: For which model does a log transform of a feature make essentially no difference?
  options:
    - { id: a, text: "A decision tree", explanation: "Correct: splits depend only on order, which log preserves." }
    - { id: b, text: "Linear regression", explanation: "Changes the shape of the relationship." }
    - { id: c, text: "k-nearest neighbours", explanation: "Changes the distances." }
  correct: [a]

