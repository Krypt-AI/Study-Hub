- id: ai06.metrics.compute
  type: code
  skill: apply
  topics: [ai06.metrics]
  language: python
  prompt: >-
    Write `metrics(y_true, y_pred)` for two equal-length lists of 0/1 labels. Return a dict with `precision`, `recall`,
    `f1` and `specificity`, using 0.0 whenever a denominator is 0. Do not use scikit-learn.
  starterCode: |
    def metrics(y_true, y_pred):
        ...
  tests:
    - { kind: assert, name: "spam example", code: "m = metrics([1] * 50 + [0] * 100, [1] * 45 + [0] * 5 + [1] * 10 + [0] * 90)\nassert abs(m['precision'] - 45 / 55) < 1e-9 and abs(m['recall'] - 0.9) < 1e-9\nassert abs(m['specificity'] - 0.9) < 1e-9 and abs(m['f1'] - 2 * (45 / 55) * 0.9 / (45 / 55 + 0.9)) < 1e-9" }
    - { kind: assert, name: "no positives predicted", code: "m = metrics([1, 0], [0, 0])\nassert m['precision'] == 0.0 and m['f1'] == 0.0 and m['specificity'] == 1.0" }
  solution: |
    def metrics(y_true, y_pred):
        tp = sum(1 for t, p in zip(y_true, y_pred) if t == 1 and p == 1)
        fp = sum(1 for t, p in zip(y_true, y_pred) if t == 0 and p == 1)
        fn = sum(1 for t, p in zip(y_true, y_pred) if t == 1 and p == 0)
        tn = sum(1 for t, p in zip(y_true, y_pred) if t == 0 and p == 0)
        div = lambda a, b: a / b if b else 0.0
        precision = div(tp, tp + fp)
        recall = div(tp, tp + fn)
        return {
            'precision': precision,
            'recall': recall,
            'f1': div(2 * precision * recall, precision + recall),
            'specificity': div(tn, tn + fp),
        }

- id: ai06.metrics.cost
  type: code
  skill: apply
  topics: [ai06.metrics]
  language: python
  prompt: >-
    Write `cheapest_threshold(y_true, proba, cost_fn, cost_fp, thresholds)` returning the threshold with the lowest
    total cost `cost_fn·FN + cost_fp·FP`, predicting 1 when proba ≥ threshold. On ties return the smallest threshold.
  starterCode: |
    def cheapest_threshold(y_true, proba, cost_fn, cost_fp, thresholds):
        ...
  tests:
    - { kind: assert, name: "missed fraud expensive", code: "y = [1, 0, 0, 0, 1]\np = [0.35, 0.3, 0.6, 0.1, 0.9]\nassert cheapest_threshold(y, p, 2000, 20, [0.2, 0.5, 0.8]) == 0.2" }
    - { kind: assert, name: "false alarms expensive", code: "y = [1, 0, 0, 0, 1]\np = [0.35, 0.3, 0.6, 0.1, 0.9]\nassert cheapest_threshold(y, p, 10, 1000, [0.2, 0.5, 0.8]) == 0.8" }
  solution: |
    def cheapest_threshold(y_true, proba, cost_fn, cost_fp, thresholds):
        def cost(t):
            fn = sum(1 for y, p in zip(y_true, proba) if y == 1 and p < t)
            fp = sum(1 for y, p in zip(y_true, proba) if y == 0 and p >= t)
            return cost_fn * fn + cost_fp * fp
        return min(sorted(thresholds), key=cost)
