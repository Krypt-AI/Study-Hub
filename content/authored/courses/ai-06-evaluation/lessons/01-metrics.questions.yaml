- id: ai06.metrics.which
  type: choice
  skill: apply
  topics: [ai06.metrics]
  prompt: A model auto-blocks bank transfers it thinks are fraudulent; blocking a genuine transfer angers customers. Which metric should you protect most?
  options:
    - { id: a, text: "Precision", explanation: "Correct: false positives (blocked genuine transfers) are the costly error." }
    - { id: b, text: "Recall", explanation: "Matters too, but the stated cost is false positives." }
    - { id: c, text: "Accuracy", explanation: "Dominated by the many genuine transfers." }
  correct: [a]

