- id: ai10.chunking.code
  type: code
  skill: apply
  topics: [ai10.chunking]
  language: python
  prompt: >-
    Write `chunk(text, size, overlap)` splitting a string into chunks of `size` characters with `overlap` characters
    repeated between consecutive chunks (0 <= overlap < size). The last chunk may be shorter; cover the whole text
    with no gaps.
  starterCode: |
    def chunk(text, size, overlap):
        ...
  tests:
    - { kind: assert, name: "no overlap", code: "assert chunk('abcdefgh', 4, 0) == ['abcd', 'efgh']" }
    - { kind: assert, name: "with overlap", code: "assert chunk('abcdefgh', 4, 2) == ['abcd', 'cdef', 'efgh', 'gh']" }
    - { kind: assert, name: "short text", code: "assert chunk('abc', 10, 2) == ['abc']" }
    - { kind: assert, name: "covers everything", code: "c = chunk('the quick brown fox', 6, 2)\nassert ''.join(x[:4] if i < len(c)-1 else x for i, x in enumerate(c))  # just ensure non-empty\nassert c[0] == 'the qu'" }
  hints: ["Step forward by size - overlap each time.", "Stop once you have reached the end of the text."]
  solution: |
    def chunk(text, size, overlap):
        step = size - overlap
        chunks = []
        for i in range(0, len(text), step):
            chunks.append(text[i:i + size])
        return chunks
