- id: ai10.chunking.toobig
  type: choice
  skill: apply
  topics: [ai10.chunking]
  prompt: What goes wrong if chunks are very large?
  options:
    - { id: a, text: "One embedding blurs several topics, so retrieval is imprecise and each hit floods the context", explanation: "Correct." }
    - { id: b, text: "Embeddings refuse long text", explanation: "They handle it; precision is the issue." }
    - { id: c, text: "Nothing — bigger is always better", explanation: "It is a trade-off." }
  correct: [a]

- id: ai10.chunking.overlap
  type: choice
  skill: recognize
  topics: [ai10.chunking]
  prompt: What does chunk overlap protect against?
  options:
    - { id: a, text: "A relevant passage being split across a boundary and lost from both chunks", explanation: "Correct." }
    - { id: b, text: "Embeddings being too accurate", explanation: "No such problem." }
    - { id: c, text: "The vector database crashing", explanation: "Unrelated." }
  correct: [a]

- id: ai10.chunking.metadata
  type: choice
  skill: apply
  topics: [ai10.chunking]
  prompt: Why attach metadata (source, section, access tags) to each chunk?
  options:
    - { id: a, text: "To enable citation and to filter retrieval by document, recency or permission", explanation: "Correct." }
