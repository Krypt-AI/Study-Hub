id: linux-fundamentals
title: Linux Fundamentals
subtitle: Ubuntu Server LTS · from your first command to a documented server
description: >-
  A beginner's Linux course for IT diploma students. You build your own Ubuntu Server lab in a virtual machine
  and learn, one module at a time, what an entry-level support or junior administration role expects: the
  command line, files, Bash, users and permissions, packages, processes, services, storage, networking,
  monitoring, security, backups and routine automation. Each module explains the ideas, shows the commands with
  the output to expect, walks you through a guided lab, leaves you independent exercises, checks your
  understanding with questions that explain every answer, and ends with a practical assessment and a module
  quiz. Ubuntu Server is the main environment; where Red Hat Enterprise Linux and its relatives (Rocky Linux,
  AlmaLinux, Fedora) differ, the lesson says how. The capstone asks you to configure and document a server for a
  small organisation. This course is the foundation for Linux+, LFCS, RHCSA and LPIC-1, and for the cloud,
  DevOps and security certifications that rely on Linux: it does not on its own prepare you for those exams.
category: it
subject: linux
level: Beginner
difficulty: beginner
tags: [linux, ubuntu, command-line, bash, system-administration]
estimatedHours: 75
contentNotice: >-
  Every command runs in **your own lab virtual machine**, not in the browser: Study Hub has no Linux sandbox, so
  Bash code here is for reading and copying. Examples were written for **Ubuntu Server 26.04 LTS**; every lab also
  works on 24.04 LTS. Version numbers, dates, addresses and sizes in the sample output will differ on your machine.
  Ubuntu 26.04 uses Rust rewrites of `sudo` (sudo-rs) and of the core utilities (uutils): commands and options are
  the same for everything taught here, but a few error messages are worded differently. Practical assessments are
  marked by you against the listed points; keep the evidence they ask for, because the capstone reuses it.
