- id: sec10.consensus.mine-code
  type: code
  skill: apply
  topics: [sec10.consensus]
  language: python
  prompt: >-
    Implement a toy proof-of-work. Write `mine(header, difficulty)` returning the smallest non-negative integer nonce
    such that the SHA-256 hex of `f"{header}{nonce}"` starts with `difficulty` zero characters, and
    `check(header, nonce, difficulty)` returning whether a nonce satisfies the target. Keep difficulty small (1–3).
  starterCode: |
    import hashlib

    def mine(header, difficulty):
        ...

    def check(header, nonce, difficulty):
        ...
  tests:
    - { kind: assert, name: "mined nonce checks out", code: "n = mine('block-1', 2)\nassert check('block-1', n, 2)" }
    - { kind: assert, name: "it is the smallest", code: "n = mine('abc', 2)\nassert all(not check('abc', k, 2) for k in range(n))" }
    - { kind: assert, name: "check rejects non-solutions", code: "assert not check('abc', 0, 3) or check('abc', 0, 3)  # just ensure it returns a bool\nassert isinstance(check('abc', 1, 1), bool)" }
  hints: ["Loop nonce from 0 upward until check passes."]
  solution: |
    import hashlib

    def check(header, nonce, difficulty):
        digest = hashlib.sha256(f"{header}{nonce}".encode()).hexdigest()
        return digest.startswith("0" * difficulty)

    def mine(header, difficulty):
        nonce = 0
        while not check(header, nonce, difficulty):
            nonce += 1
        return nonce
