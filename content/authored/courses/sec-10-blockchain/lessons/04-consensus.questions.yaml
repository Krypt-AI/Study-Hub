- id: sec10.consensus.verify-easy
  type: choice
  skill: recognize
  topics: [sec10.consensus]
  prompt: What is the key asymmetry in proof-of-work?
  options:
    - { id: a, text: "Finding a qualifying hash is hard (brute force), but checking it is one quick hash.", explanation: "Correct." }
    - { id: b, text: "Both finding and checking are hard.", explanation: "Checking is trivial." }
    - { id: c, text: "Both are easy.", explanation: "Finding one is deliberately expensive." }
  correct: [a]

- id: sec10.consensus.confirmations
  type: choice
  skill: apply
  topics: [sec10.consensus]
  prompt: Why do exchanges wait for several confirmations before treating a deposit as final on a proof-of-work chain?
  options:
    - { id: a, text: "A shallow fork could still reorganise the tip; more blocks on top make reversal exponentially harder.", explanation: "Correct." }
    - { id: b, text: "To let the sender cancel.", explanation: "Confirmed transactions are not cancellable by the sender." }
    - { id: c, text: "Because signatures take time to verify.", explanation: "Verification is fast; depth is the issue." }
  correct: [a]

