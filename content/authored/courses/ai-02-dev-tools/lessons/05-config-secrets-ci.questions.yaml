- id: ai02.config.where
  type: choice
  skill: apply
  topics: [ai02.config]
  multiple: true
  prompt: Which belong in environment variables or a secret store rather than a committed config file? Choose all that apply.
  options:
    - { id: a, text: "The LLM provider API key", explanation: "A secret." }
    - { id: b, text: "The database password", explanation: "A secret." }
    - { id: c, text: "The learning rate", explanation: "Not secret: a config file or CLI option is fine." }
    - { id: d, text: "The model name", explanation: "Not secret." }
  correct: [a, b]

- id: ai02.config.example-file
  type: choice
  skill: recognize
  topics: [ai02.config]
  prompt: What should `.env.example` contain?
  options:
    - { id: a, text: "The variable names the project needs, with placeholder or empty values", explanation: "Correct: it documents configuration without exposing secrets." }
    - { id: b, text: "A copy of your real `.env`", explanation: "That would commit the secrets." }
    - { id: c, text: "Nothing; it is created automatically", explanation: "You write it by hand." }
  correct: [a]

- id: ai02.config.first-step
  type: choice
  skill: apply
  topics: [ai02.config]
  prompt: You notice an API key in a commit pushed an hour ago. What is the first thing to do?
  options:
    - { id: a, text: "Revoke or rotate the key at the provider.", explanation: "Correct: assume it is compromised; everything else comes after." }
    - { id: b, text: "Rewrite Git history to remove it.", explanation: "Useful later, but the key is still valid and may already be copied." }
    - { id: c, text: "Make the repository private.", explanation: "Copies may already exist." }
  correct: [a]

- id: ai02.config.locked
  type: choice
  skill: recognize
  topics: [ai02.config]
  prompt: "Why use `uv sync --locked` in CI rather than `uv sync`?"
  options:
    - { id: a, text: "It fails if `uv.lock` does not match `pyproject.toml`, proving the committed lock file is current.", explanation: "Correct." }
    - { id: b, text: "It installs packages faster.", explanation: "Speed is not the point." }
    - { id: c, text: "It skips installing dev dependencies.", explanation: "That is a different option." }
  correct: [a]

- id: ai02.config.load-settings
  type: code
  skill: apply
  topics: [ai02.config]
  language: python
  prompt: >-
    Write `load_settings(env, defaults)` where both are dicts. Return a new dict that starts from `defaults` and takes
    any key present in `env` whose name is the default's name in upper case prefixed with `APP_` (so `temperature`
    reads `APP_TEMPERATURE`). Convert the env string to the default value's type (int, float or str). If
    `APP_API_KEY` is missing or empty, raise `RuntimeError`, and include the key as `api_key`.
  starterCode: |
    def load_settings(env, defaults):
        ...
  tests:
    - { kind: assert, name: "defaults kept", code: "s = load_settings({'APP_API_KEY': 'k'}, {'temperature': 0.0, 'epochs': 3})\nassert s == {'temperature': 0.0, 'epochs': 3, 'api_key': 'k'}" }
    - { kind: assert, name: "override and convert", code: "s = load_settings({'APP_API_KEY': 'k', 'APP_EPOCHS': '7', 'APP_TEMPERATURE': '0.5'}, {'temperature': 0.0, 'epochs': 3})\nassert s['epochs'] == 7 and s['temperature'] == 0.5" }
    - { kind: assert, name: "missing key raises", code: "try:\n    load_settings({}, {'epochs': 1})\n    raise AssertionError('expected RuntimeError')\nexcept RuntimeError:\n    pass" }
  solution: |
    def load_settings(env, defaults):
        key = env.get('APP_API_KEY')
        if not key:
            raise RuntimeError('APP_API_KEY is not set')
        settings = {}
        for name, default in defaults.items():
            raw = env.get('APP_' + name.upper())
            settings[name] = default if raw is None else type(default)(raw)
        settings['api_key'] = key
        return settings
