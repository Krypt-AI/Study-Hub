- id: ai02.quality.approx
  type: choice
  skill: apply
  topics: [ai02.quality]
  prompt: "`assert 0.1 + 0.2 == 0.3` fails. Which pytest tool is meant for this?"
  options:
    - { id: a, text: "`pytest.approx`", explanation: "Correct: `0.1 + 0.2 == pytest.approx(0.3)` compares within a tolerance." }
    - { id: b, text: "`pytest.raises`", explanation: "That checks that an exception is raised." }
    - { id: c, text: "`pytest.mark.skip`", explanation: "Skipping hides the problem." }
  correct: [a]

