- id: ai02.quality.what-to-test
  type: choice
  skill: apply
  multiple: true
  topics: [ai02.quality]
  prompt: Which are good automated tests for an ML project? Choose all that apply.
  options:
    - { id: a, text: "The train and test splits share no row ids.", explanation: "Catches leakage cheaply." }
    - { id: b, text: "Predicted probabilities are all between 0 and 1 and contain no NaN.", explanation: "An invariant every model must keep." }
    - { id: c, text: "The model can nearly memorise ten training examples.", explanation: "The classic smoke test of a training loop." }
    - { id: d, text: "Test accuracy is exactly 0.9134.", explanation: "Brittle: tiny library or seed changes break it. Test a range or invariants instead." }
  correct: [a, b, c]

- id: ai02.quality.word-counts
  type: code
  skill: apply
  topics: [ai02.quality]
  language: python
  prompt: >-
    Implement `normalise(text)` (lower-case, keep only letters, digits and spaces, collapse runs of spaces, strip) and
    `word_counts(text)` (a dict of word to count after normalising). The tests are the pytest-style checks from the
    lesson.
  starterCode: |
    def normalise(text):
        ...

    def word_counts(text):
        ...
  tests:
    - { kind: assert, name: "normalise", code: "assert normalise('  FREE Money!! ') == 'free money'" }
    - { kind: assert, name: "collapse spaces", code: "assert normalise('a   b') == 'a b'" }
    - { kind: assert, name: "counts", code: "assert word_counts('a a b') == {'a': 2, 'b': 1}" }
    - { kind: assert, name: "empty", code: "assert word_counts('') == {}" }
    - { kind: assert, name: "punctuation", code: "assert word_counts('Win! win? WIN.') == {'win': 3}" }
  solution: |
    def normalise(text):
        kept = ''.join(ch for ch in text.lower() if ch.isalnum() or ch.isspace())
        return ' '.join(kept.split())

    def word_counts(text):
        counts = {}
        for word in normalise(text).split():
            counts[word] = counts.get(word, 0) + 1
        return counts
