- id: ai13.privacy.redact-code
  type: code
  skill: apply
  topics: [ai13.privacy]
  language: python
  prompt: >-
    Write `redact(text)` replacing email addresses with `[EMAIL]` and standalone runs of 10+ digits with `[NUMBER]`,
    and `contains_pii(text)` returning True if either pattern is present. Use the `re` module.
  starterCode: |
    import re

    def redact(text):
        ...

    def contains_pii(text):
        ...
  tests:
    - { kind: assert, name: "redacts email", code: "assert redact('reach me at a.b+x@mail.co') == 'reach me at [EMAIL]'" }
    - { kind: assert, name: "redacts long number", code: "assert redact('id 1234567890 ok') == 'id [NUMBER] ok'" }
    - { kind: assert, name: "short number kept", code: "assert redact('call 999') == 'call 999'" }
    - { kind: assert, name: "detection", code: "assert contains_pii('x@y.com') and not contains_pii('hello world')" }
  solution: |
    import re

    EMAIL = r"[\w.+-]+@[\w-]+\.[\w.-]+"
    NUMBER = r"\b\d{10,}\b"

    def redact(text):
        text = re.sub(EMAIL, "[EMAIL]", text)
        text = re.sub(NUMBER, "[NUMBER]", text)
        return text

    def contains_pii(text):
        return re.search(EMAIL, text) is not None or re.search(NUMBER, text) is not None
