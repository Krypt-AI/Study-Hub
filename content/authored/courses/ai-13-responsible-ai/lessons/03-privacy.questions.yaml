- id: ai13.privacy.minimisation
  type: choice
  skill: apply
  topics: [ai13.privacy]
  prompt: What is the first principle for handling personal data in an LLM app?
  options:
    - { id: a, text: "Data minimisation — collect and send only what the task genuinely needs", explanation: "Correct." }
    - { id: b, text: "Send everything so the model has full context", explanation: "Maximises exposure and risk." }
    - { id: c, text: "Log all prompts permanently", explanation: "A privacy and security liability." }
  correct: [a]

