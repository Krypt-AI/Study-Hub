- id: ai13.fairness.source
  type: choice
  skill: recognize
  topics: [ai13.fairness]
  prompt: A hiring model trained on past decisions favours the group historically hired. This is…
  options:
    - { id: a, text: "Historical bias — the data reflects past inequity, which the model reproduces", explanation: "Correct." }
    - { id: b, text: "A random glitch", explanation: "It is systematic, from the data." }
    - { id: c, text: "Impossible if accuracy is high", explanation: "High overall accuracy can hide group harm." }
  correct: [a]

