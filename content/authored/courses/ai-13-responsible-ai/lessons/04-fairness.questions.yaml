- id: ai13.fairness.group-metric
  type: code
  skill: apply
  topics: [ai13.fairness]
  language: python
  prompt: >-
    Write `group_rates(records)` where each record is `(group, outcome)` with outcome 0/1. Return a dict mapping each
    group to its positive rate (mean outcome), and `max_gap(records)` returning the difference between the highest and
    lowest group positive rates (0.0 if fewer than two groups).
  starterCode: |
    def group_rates(records):
        ...

    def max_gap(records):
        ...
  tests:
    - { kind: assert, name: "rates", code: "r = group_rates([('a', 1), ('a', 0), ('b', 1), ('b', 1)])\nassert r == {'a': 0.5, 'b': 1.0}" }
    - { kind: assert, name: "gap", code: "assert max_gap([('a', 1), ('a', 0), ('b', 1), ('b', 1)]) == 0.5" }
    - { kind: assert, name: "single group gap zero", code: "assert max_gap([('a', 1), ('a', 0)]) == 0.0" }
  solution: |
    def group_rates(records):
        totals = {}
        counts = {}
        for group, outcome in records:
            totals[group] = totals.get(group, 0) + outcome
            counts[group] = counts.get(group, 0) + 1
        return {g: totals[g] / counts[g] for g in totals}

    def max_gap(records):
        rates = list(group_rates(records).values())
        if len(rates) < 2:
            return 0.0
        return max(rates) - min(rates)
