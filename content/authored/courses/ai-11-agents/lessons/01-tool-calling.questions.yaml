- id: ai11.tools.who-runs
  type: choice
  skill: recognize
  topics: [ai11.tools]
  prompt: In tool calling, what does the model actually produce?
  options:
    - { id: a, text: "A structured request to call a named tool with arguments; your code executes it", explanation: "Correct." }
    - { id: b, text: "The executed result of the function", explanation: "Your code executes; the model only requests." }
    - { id: c, text: "Nothing until the user runs code", explanation: "The model emits the call request." }
  correct: [a]

