- id: ai11.tools.dispatch-code
  type: code
  skill: apply
  topics: [ai11.tools]
  language: python
  prompt: >-
    Build a tool registry and dispatcher. Write a class `ToolRegistry` with `register(name, fn)` and
    `call(request)` where `request` is a dict `{"name": str, "args": dict}`. `call` runs the registered function with
    `**args` and returns its result; if the tool is unknown, return the string `"error: unknown tool <name>"`.
  starterCode: |
    class ToolRegistry:
        def __init__(self):
            self.tools = {}

        def register(self, name, fn):
            ...

        def call(self, request):
            ...
  tests:
    - { kind: assert, name: "dispatch", code: "r = ToolRegistry()\nr.register('add', lambda a, b: a + b)\nassert r.call({'name': 'add', 'args': {'a': 2, 'b': 3}}) == 5" }
    - { kind: assert, name: "unknown tool", code: "r = ToolRegistry()\nassert r.call({'name': 'nope', 'args': {}}) == 'error: unknown tool nope'" }
    - { kind: assert, name: "another tool", code: "r = ToolRegistry()\nr.register('upper', lambda text: text.upper())\nassert r.call({'name': 'upper', 'args': {'text': 'hi'}}) == 'HI'" }
  solution: |
    class ToolRegistry:
        def __init__(self):
            self.tools = {}

        def register(self, name, fn):
            self.tools[name] = fn

        def call(self, request):
            name = request['name']
            if name not in self.tools:
                return f'error: unknown tool {name}'
            return self.tools[name](**request.get('args', {}))
