- id: ai08.embeddings.nn-code
  type: code
  skill: apply
  topics: [ai08.embeddings]
  language: python
  packages: [numpy]
  prompt: >-
    Write `cosine(a, b)` and `top_k(query, items, k)` where `items` is a dict name→vector (lists/arrays). Return the
    `k` names most similar to `query` by cosine similarity, most similar first.
  starterCode: |
    import numpy as np

    def cosine(a, b):
        ...

    def top_k(query, items, k):
        ...
  tests:
    - { kind: assert, name: "cosine", code: "import numpy as np\nassert abs(cosine([1, 0], [1, 1]) - 0.7071) < 1e-3" }
    - { kind: assert, name: "ranking", code: "items = {'a': [1, 0], 'b': [0.9, 0.1], 'c': [0, 1], 'd': [-1, 0]}\nassert top_k([1, 0.05], items, 2) == ['a', 'b']" }
    - { kind: assert, name: "k larger than items", code: "assert set(top_k([1, 0], {'x': [1, 0], 'y': [0, 1]}, 5)) == {'x', 'y'}" }
  solution: |
    import numpy as np

    def cosine(a, b):
        a, b = np.asarray(a, dtype=float), np.asarray(b, dtype=float)
        return float(a @ b / (np.linalg.norm(a) * np.linalg.norm(b)))

    def top_k(query, items, k):
        ranked = sorted(items, key=lambda name: cosine(query, items[name]), reverse=True)
        return ranked[:k]
