- id: ai08.embeddings.geometry
  type: choice
  skill: recognize
  topics: [ai08.embeddings]
  prompt: What makes an embedding more useful than a token id for comparing meaning?
  options:
    - { id: a, text: "Its geometry: similar meanings map to nearby vectors, so distance encodes semantic similarity", explanation: "Correct." }
    - { id: b, text: "It is shorter than a token id", explanation: "It is a longer vector, not shorter." }
    - { id: c, text: "It is encrypted", explanation: "Embeddings are not encryption." }
