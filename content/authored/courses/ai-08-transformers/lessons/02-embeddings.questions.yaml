- id: ai08.embeddings.search
  type: choice
  skill: apply
  topics: [ai08.embeddings]
  prompt: How does semantic search find relevant passages for a query?
  options:
    - { id: a, text: "Embed the query and candidates, then rank candidates by cosine similarity to the query", explanation: "Correct." }
    - { id: b, text: "Match the query's exact characters", explanation: "That is keyword search, not semantic." }
    - { id: c, text: "Hash the query and look it up", explanation: "Hashes carry no semantic geometry." }
