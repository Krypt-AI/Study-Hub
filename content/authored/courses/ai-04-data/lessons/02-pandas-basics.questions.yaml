- id: ai04.pandas.top-students
  type: code
  skill: apply
  topics: [ai04.pandas]
  language: python
  packages: [pandas]
  prompt: >-
    Write `top_students(df, topic, n)` returning a list of the `n` student names with the highest `score` in the given
    `topic`, highest first. Ignore rows whose score is missing.
  starterCode: |
    import pandas as pd

    def top_students(df, topic, n):
        ...
  tests:
    - { kind: assert, name: "kanji top 2", code: "import pandas as pd\ndf = pd.DataFrame({'student': ['A', 'B', 'C', 'D'], 'topic': ['kanji', 'kanji', 'vocab', 'kanji'], 'score': [0.5, 0.9, 1.0, None]})\nassert top_students(df, 'kanji', 2) == ['B', 'A']" }
    - { kind: assert, name: "n larger than rows", code: "import pandas as pd\ndf = pd.DataFrame({'student': ['A'], 'topic': ['vocab'], 'score': [0.4]})\nassert top_students(df, 'vocab', 5) == ['A']" }
  solution: |
    import pandas as pd

    def top_students(df, topic, n):
        rows = df[(df['topic'] == topic) & df['score'].notna()]
        return rows.sort_values('score', ascending=False)['student'].head(n).tolist()
