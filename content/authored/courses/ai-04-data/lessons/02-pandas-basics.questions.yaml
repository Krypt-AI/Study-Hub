- id: ai04.pandas.info
  type: choice
  skill: apply
  topics: [ai04.pandas]
  prompt: "`df.info()` shows the column `price` with dtype `object`. What does that most likely mean?"
  options:
    - { id: a, text: "Some values are text (such as \"1,200\" or \"N/A\"), so pandas could not read the column as numbers.", explanation: "Correct: fix with cleaning and `pd.to_numeric`." }
    - { id: b, text: "The prices are very large numbers.", explanation: "Large numbers are still int64 or float64." }
    - { id: c, text: "The column is the index.", explanation: "Unrelated." }
  correct: [a]

- id: ai04.pandas.filter-ops
  type: choice
  skill: apply
  topics: [ai04.pandas]
  prompt: Which filter is valid pandas?
  options:
    - { id: a, text: "`df[(df['a'] > 1) & (df['b'] == 'x')]`", explanation: "Correct: element-wise `&` with brackets." }
    - { id: b, text: "`df[df['a'] > 1 and df['b'] == 'x']`", explanation: "`and` raises \"truth value of a Series is ambiguous\"." }
    - { id: c, text: "`df[df['a'] > 1 & df['b'] == 'x']`", explanation: "Without brackets `&` binds before the comparisons." }
  correct: [a]

- id: ai04.pandas.chained
  type: choice
  skill: apply
  topics: [ai04.pandas]
  prompt: Which line reliably sets `score` to 0 for rows where `minutes` is 0?
  options:
    - { id: a, text: "`df.loc[df['minutes'] == 0, 'score'] = 0`", explanation: "Correct: a single `.loc` call." }
    - { id: b, text: "`df[df['minutes'] == 0]['score'] = 0`", explanation: "Chained assignment changes a temporary copy." }
    - { id: c, text: "`df['score'][df['minutes'] == 0] == 0`", explanation: "That is a comparison, not an assignment." }
  correct: [a]

