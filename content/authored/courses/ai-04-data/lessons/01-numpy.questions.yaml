- id: ai04.numpy.mask
  type: choice
  skill: apply
  topics: [ai04.numpy]
  prompt: "Given `X = np.arange(12).reshape(3, 4)`, what does `X[:, 0]` return?"
  options:
    - { id: a, text: "`[0 4 8]`", explanation: "Correct: column 0 of every row." }
