- id: ai04.combine.summary
  type: code
  skill: apply
  topics: [ai04.combine]
  language: python
  packages: [pandas]
  prompt: >-
    Write `topic_summary(sessions)` returning a DataFrame with one row per `topic`, sorted by topic, with columns
    `topic`, `attempts` (number of rows), `mean_score` and `total_minutes`.
  starterCode: |
    import pandas as pd

    def topic_summary(sessions):
        ...
  tests:
    - { kind: assert, name: "summary", code: "import pandas as pd\ns = pd.DataFrame({'topic': ['b', 'a', 'a'], 'score': [0.5, 0.6, 1.0], 'minutes': [10, 20, 30]})\nout = topic_summary(s)\nassert out['topic'].tolist() == ['a', 'b']\nassert out['attempts'].tolist() == [2, 1]\nassert abs(out.loc[0, 'mean_score'] - 0.8) < 1e-9 and out['total_minutes'].tolist() == [50, 10]" }
  solution: |
    import pandas as pd

    def topic_summary(sessions):
        return (
            sessions.groupby('topic')
            .agg(attempts=('score', 'size'), mean_score=('score', 'mean'), total_minutes=('minutes', 'sum'))
            .reset_index()
            .sort_values('topic')
            .reset_index(drop=True)
        )
