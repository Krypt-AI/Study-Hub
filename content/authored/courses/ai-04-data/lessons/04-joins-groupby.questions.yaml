- id: ai04.combine.inner-count
  type: short
  skill: apply
  topics: [ai04.combine]
  prompt: >-
    `customers` has ids 1, 2, 3. `orders` has customer_id values 1, 1, 4. How many rows does an inner merge on
    `customer_id` produce?
  accepted: ["2"]
  match: { mode: number }
  explanation: "Only id 1 is in both tables, and it has two orders."

- id: ai04.combine.validate
  type: choice
  skill: recognize
  topics: [ai04.combine]
  prompt: "What does `validate='one_to_many'` in `merge` protect against?"
  options:
    - { id: a, text: "Duplicate keys in the left table, which would multiply rows unexpectedly", explanation: "Correct." }
    - { id: b, text: "Missing values in the right table", explanation: "Not checked by validate." }
    - { id: c, text: "Columns with different names", explanation: "Use left_on and right_on for that." }
  correct: [a]

- id: ai04.combine.transform
  type: choice
  skill: apply
  topics: [ai04.combine]
  prompt: You want each row to carry its student's average score. Which call?
  options:
    - { id: a, text: "`df.groupby('student')['score'].transform('mean')`", explanation: "Correct: same length as df." }
    - { id: b, text: "`df.groupby('student')['score'].mean()`", explanation: "One row per student, not per original row." }
    - { id: c, text: "`df['score'].mean()`", explanation: "The overall mean." }
  correct: [a]

- id: ai04.combine.wide-long
  type: cloze
