- id: py.control.range-values
  type: short
  skill: recall
  topics: [py.control]
  prompt: How many numbers does `range(2, 11, 2)` produce?
  accepted: ["5"]
  match: { mode: number }
  hints: ["List them: start at 2, step by 2, stop before 11."]
  explanation: "`range(2, 11, 2)` yields 2, 4, 6, 8, 10: five numbers. The stop value 11 is excluded."

- id: py.control.order-of-branches
  type: choice
  skill: recognize
  topics: [py.control]
  prompt: "In `grade`, what happens if the `score >= 65` test is written before `score >= 80`?"
  options:
    - { id: a, text: "Nothing changes; Python evaluates all branches.", explanation: "Python runs only the first branch whose condition is true." }
    - { id: b, text: "Scores of 80 and above get \"B\" instead of \"A\".", explanation: "A score of 90 also satisfies `score >= 65`, which is now checked first." }
    - { id: c, text: "It raises a SyntaxError.", explanation: "Any order of conditions is valid syntax." }
  correct: [b]

- id: py.control.comprehension-cloze
  type: cloze
  skill: recall
  topics: [py.control]
  prompt: Complete the comprehension so it keeps only the words longer than 3 characters, upper-cased.
  text: "`[w.upper() [[1]] w in words [[2]] len(w) > 3]`"
  blanks:
