  correct: [a]

- id: ai03.optim.scaling
  type: long
  skill: explain
  topics: [ai03.optim]
  prompt: Why should you standardise features before training with gradient descent?
  minWords: 25
  rubric:
    - { id: ranges, label: "Features on very different scales give gradients of very different sizes", keywords: [["scale", "range", "magnitude"]] }
    - { id: lr, label: "A single learning rate cannot suit all of them (too big for some, too small for others)", keywords: [["learning rate", "step"]] }
    - { id: faster, label: "Standardising makes convergence faster and more stable", keywords: [["faster", "converge", "stable", "zig"]] }
  modelAnswer: >-
    When one feature ranges in the thousands and another between 0 and 1, the loss surface is stretched and the
    gradient components differ hugely in size. One learning rate is then too large for some directions (oscillating)
    and too small for others (crawling). Standardising each feature to mean 0 and standard deviation 1 makes the
    surface rounder, so gradient descent converges faster and more stably.

- id: ai03.optim.cross-entropy
  type: code
  skill: apply
  topics: [ai03.optim]
  language: python
  prompt: >-
    Write `mse(y_true, y_pred)` and `binary_cross_entropy(y_true, p)`. Clip each probability to
    [1e-12, 1 − 1e-12] before taking logarithms so the loss is never infinite.
  starterCode: |
    import math

    def mse(y_true, y_pred):
        ...

    def binary_cross_entropy(y_true, p):
        ...
  tests:
    - { kind: assert, name: "mse", code: "assert abs(mse([1, 2, 3], [1, 2, 5]) - 4 / 3) < 1e-9" }
    - { kind: assert, name: "bce good prediction", code: "assert abs(binary_cross_entropy([1, 0], [0.9, 0.1]) - 0.1053605) < 1e-6" }
    - { kind: assert, name: "bce clipped", code: "assert binary_cross_entropy([1], [0.0]) < 30" }
  solution: |
    import math

    def mse(y_true, y_pred):
        return sum((p - t) ** 2 for t, p in zip(y_true, y_pred)) / len(y_true)

    def binary_cross_entropy(y_true, p):
        eps = 1e-12
        total = 0.0
        for t, q in zip(y_true, p):
            q = min(max(q, eps), 1 - eps)
            total += t * math.log(q) + (1 - t) * math.log(1 - q)
        return -total / len(y_true)

- id: ai03.optim.fit-line
  type: code
  skill: apply
  topics: [ai03.optim]
  language: python
  prompt: >-
    Implement `fit_line(xs, ys, lr=0.05, steps=2000)` that fits ŷ = w·x + b by gradient descent on MSE and returns
    `(w, b)`.
  starterCode: |
    def fit_line(xs, ys, lr=0.05, steps=2000):
        w, b = 0.0, 0.0
        ...
        return w, b
  tests:
    - { kind: assert, name: "y = 2x + 1", code: "w, b = fit_line([0, 1, 2, 3], [1, 3, 5, 7])\nassert abs(w - 2) < 1e-3 and abs(b - 1) < 1e-3" }
    - { kind: assert, name: "y = -x + 4", code: "w, b = fit_line([0, 1, 2, 3, 4], [4, 3, 2, 1, 0])\nassert abs(w + 1) < 1e-3 and abs(b - 4) < 1e-3" }
  solution: |
    def fit_line(xs, ys, lr=0.05, steps=2000):
        w, b, n = 0.0, 0.0, len(xs)
        for _ in range(steps):
            errors = [w * x + b - y for x, y in zip(xs, ys)]
            w -= lr * 2 / n * sum(e * x for e, x in zip(errors, xs))
            b -= lr * 2 / n * sum(errors)
        return w, b
