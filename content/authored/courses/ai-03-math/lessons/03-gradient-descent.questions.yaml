- id: ai03.optim.update
  type: short
  skill: apply
  topics: [ai03.optim]
  prompt: "A parameter θ = 2.0 has gradient 0.5 and the learning rate is 0.1. What is θ after one gradient descent step?"
  accepted: ["1.95"]
  match: { mode: number, tolerance: 0.0001 }
  explanation: "θ − η·g = 2.0 − 0.1·0.5 = 1.95."

- id: ai03.optim.loss-choice
  type: choice
  skill: apply
  topics: [ai03.optim]
  prompt: Which loss fits predicting whether a transaction is fraudulent (yes/no) with a probability?
  options:
