- id: ai03.linalg.norm
  type: short
  skill: apply
  topics: [ai03.linalg]
  prompt: "What is the L2 norm (length) of the vector [3, 4]?"
  accepted: ["5"]
  match: { mode: number }
  explanation: "√(3² + 4²) = √25 = 5."

- id: ai03.linalg.cosine-orthogonal
  type: choice
  skill: recognize
  topics: [ai03.linalg]
  prompt: Two embedding vectors have cosine similarity 0. What does that mean?
  options:
    - { id: a, text: "They are orthogonal: no shared direction.", explanation: "Correct." }
    - { id: b, text: "They are identical.", explanation: "Identical directions give 1." }
    - { id: c, text: "One of them is all zeros.", explanation: "Cosine is undefined for a zero vector." }
  correct: [a]

