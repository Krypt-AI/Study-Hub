- id: ai03.linalg.elementwise
  type: choice
  skill: recognize
  topics: [ai03.linalg]
  prompt: "In NumPy, what is the difference between `A * B` and `A @ B`?"
  options:
    - { id: a, text: "`*` multiplies element by element; `@` is matrix multiplication.", explanation: "Correct." }
    - { id: b, text: "They are the same.", explanation: "Only for some special cases." }
    - { id: c, text: "`@` is element-wise; `*` is matrix multiplication.", explanation: "Reversed." }
  correct: [a]

- id: ai03.linalg.cosine-code
  type: code
  skill: apply
  topics: [ai03.linalg]
  language: python
  prompt: >-
    Write `cosine(a, b)` for two equal-length lists of numbers, and `most_similar(query, items)` that returns the key of
    the dict `items` (name → vector) with the highest cosine similarity to `query`. Use plain Python.
  starterCode: |
    def cosine(a, b):
        ...

    def most_similar(query, items):
        ...
  tests:
    - { kind: assert, name: "same direction", code: "assert abs(cosine([1, 2], [2, 4]) - 1) < 1e-9" }
    - { kind: assert, name: "orthogonal", code: "assert abs(cosine([1, 0], [0, 3])) < 1e-9" }
    - { kind: assert, name: "nearest", code: "assert most_similar([1, 0.1], {'cat': [0.9, 0.2], 'car': [0, 1], 'sky': [-1, 0]}) == 'cat'" }
  solution: |
    import math

    def cosine(a, b):
        dot = sum(x * y for x, y in zip(a, b))
        return dot / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))

    def most_similar(query, items):
        return max(items, key=lambda name: cosine(query, items[name]))

- id: ai03.linalg.matmul-code
  type: code
  skill: apply
  topics: [ai03.linalg]
  language: python
  prompt: >-
    Without NumPy, write `matmul(A, B)` for matrices given as lists of rows. Raise `ValueError` if the shapes do not
    match.
  starterCode: |
    def matmul(A, B):
        ...
  tests:
    - { kind: assert, name: "2x2 by 2x1", code: "assert matmul([[1, 2], [3, 4]], [[5], [6]]) == [[17], [39]]" }
    - { kind: assert, name: "row by column", code: "assert matmul([[1, 2, 3]], [[1], [0], [-1]]) == [[-2]]" }
    - { kind: assert, name: "bad shapes", code: "try:\n    matmul([[1, 2]], [[1, 2]])\n    raise AssertionError('expected ValueError')\nexcept ValueError:\n    pass" }
  solution: |
    def matmul(A, B):
        if len(A[0]) != len(B):
            raise ValueError("inner dimensions differ")
        return [[sum(A[i][k] * B[k][j] for k in range(len(B))) for j in range(len(B[0]))] for i in range(len(A))]
