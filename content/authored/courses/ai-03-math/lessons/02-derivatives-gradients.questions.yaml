- id: ai03.calculus.numeric-gradient
  type: code
  skill: apply
  topics: [ai03.calculus]
  language: python
  prompt: >-
    Write `numeric_gradient(f, point, h=1e-5)` that returns the list of central-difference partial derivatives of `f`
    (a function taking a list of numbers) at `point`.
  starterCode: |
    def numeric_gradient(f, point, h=1e-5):
        ...
  tests:
    - { kind: assert, name: "quadratic", code: "g = numeric_gradient(lambda p: (2 * p[0] + p[1] - 5) ** 2, [1.0, 0.0])\nassert abs(g[0] + 12) < 1e-4 and abs(g[1] + 6) < 1e-4" }
    - { kind: assert, name: "product", code: "g = numeric_gradient(lambda p: p[0] * p[1], [3.0, 4.0])\nassert abs(g[0] - 4) < 1e-4 and abs(g[1] - 3) < 1e-4" }
    - { kind: assert, name: "point not modified", code: "p = [1.0, 2.0]\nnumeric_gradient(lambda q: q[0] + q[1], p)\nassert p == [1.0, 2.0]" }
  hints: ["Copy the point, add h to one coordinate, then subtract h, and divide the difference by 2h."]
  solution: |
    def numeric_gradient(f, point, h=1e-5):
        grads = []
        for i in range(len(point)):
            up = list(point)
            down = list(point)
            up[i] += h
            down[i] -= h
            grads.append((f(up) - f(down)) / (2 * h))
        return grads
