  statusNote: The exam is based on Red Hat Enterprise Linux 10.
  summary: Hands-on administration of Red Hat Enterprise Linux, performed on live systems; the base of Red Hat's certification path (RHCE next).
  objectives:
    - Understand and use essential tools (shell, redirection, grep and regular expressions, SSH, archives, links, permissions, documentation)
    - Manage software (RPM repositories and packages, Flatpak repositories and packages)
    - Create simple shell scripts (conditionals, loops, arguments, command output)
    - Operate running systems (boot targets, regaining access, processes, tuning profiles, logs and journals, services, secure file transfer)
    - Configure local storage (GPT partitions, LVM, mounting by UUID or label, swap)
    - Create and configure file systems (VFAT, ext4, XFS, NFS, autofs, extending logical volumes, permission problems)
