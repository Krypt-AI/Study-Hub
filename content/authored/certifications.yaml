- id: aws-ml-engineer-associate
  name: AWS Certified Machine Learning Engineer – Associate
  code: MLA-C02 (beta) / MLA-C01
  provider: Amazon Web Services
  url: https://aws.amazon.com/certification/certified-machine-learning-engineer-associate/
  category: ai-ml
  credentialType: professional-certification
  level: associate
  status: beta
  statusNote: >-
    MLA-C02 beta registration opened September 1, 2026 (English only); MLA-C01 in English ended September 28, 2026.
    MLA-C02 general availability is scheduled for January 14, 2027. It adds generative AI, Amazon Bedrock, RAG and agentic AI.
  summary: Build, deploy and operate ML and generative AI workloads on AWS (SageMaker, Bedrock).
  objectives:
    - Data preparation for ML
    - Model development and evaluation
    - Deployment and orchestration of ML workflows
    - Monitoring, maintenance and security of ML solutions
    - Generative AI, RAG and agentic workflows (new in MLA-C02)
  prerequisites: Recommended at least 1 year using Amazon SageMaker and other AWS ML services.
  exam:
    questions: 65 (MLA-C01)
    durationMinutes: 130
    format: Multiple choice and multiple response (MLA-C01 figures)
    delivery: Pearson VUE test centre or online proctored
    validity: 3 years
  cost: { amount: 150, currency: USD, note: MLA-C01 price; check the MLA-C02 beta price when registering. }
  studyHours: { min: 60, max: 120, estimate: true }
  resources:
    - { title: MLA-C02 update announcement, url: "https://aws.amazon.com/blogs/training-and-certification/updates-to-aws-certified-machine-learning-engineer-associate-mla-c02/", free: true, official: true }
    - { title: AWS Skill Builder exam prep plan, url: "https://skillbuilder.aws/", free: true, official: true }
  relatedCourses: [ai-05-machine-learning, ai-06-evaluation, ai-12-mlops, ai-10-rag]
  foundations:
    - courseId: linux-fundamentals
      relevance: optional
      unitIds: [linux-fundamentals.m01, linux-fundamentals.m03, linux-fundamentals.m06, linux-fundamentals.m07, linux-fundamentals.m10]
      officialRequirement: "AWS recommends at least 1 year using Amazon SageMaker and other AWS ML services."
      reason: >-
        The exam focuses on AWS's managed ML services. Linux helps with containers, training instances, notebooks and
        debugging deployments, but it is not a significant exam requirement.
      concepts:
        - "Command line and Bash"
        - "Processes and resources"
        - "Containers' Linux basics: services and logs"
      beyond:
        - "SageMaker, Bedrock and AWS ML services"
        - "MLOps pipelines and model monitoring on AWS"
      timing: "Optional; useful before the MLOps stage of the AI Engineering roadmap."
      next: "AI Engineering roadmap stage 12 (serving, Docker and MLOps)."
      sources:
        - { title: "AWS Certified Machine Learning Engineer – Associate", url: "https://aws.amazon.com/certification/certified-machine-learning-engineer-associate/", checkedOn: "2026-10-11" }
  verifiedOn: "2026-10-11"
  verificationSources:
    - "https://aws.amazon.com/certification/certified-machine-learning-engineer-associate/"
    - "https://aws.amazon.com/blogs/training-and-certification/updates-to-aws-certified-machine-learning-engineer-associate-mla-c02/"
  unverified: [MLA-C02 question count, duration and beta price were not on the pages checked.]

